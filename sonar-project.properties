sonar.projectKey=cloudguardian
sonar.projectName=CloudGuardian
sonar.sourceEncoding=UTF-8

# App code plus infrastructure-as-code (Terraform, Dockerfiles, Helm chart)
sonar.sources=apps,infra,deploy
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/.next-*/**,**/prisma/migrations/**,**/next-env.d.ts,**/*.tsbuildinfo,**/.terraform/**
sonar.typescript.tsconfigPaths=apps/api/tsconfig.json,apps/web/tsconfig.json

# There are no automated tests yet. When added, publish lcov and set:
# sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info
